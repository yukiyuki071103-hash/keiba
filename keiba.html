<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ポケット馬券 競馬ゲーム</title>
<meta name="description" content="架空の競馬場で遊ぶ馬券ゲーム。逃げ・差し・追い込みを再現したドット絵レースで、1日12レースに挑戦。">
<meta property="og:type" content="website">
<meta property="og:title" content="ポケット馬券">
<meta property="og:description" content="架空の競馬場で遊ぶドット絵の競馬ゲーム。5万円で12レース、1日ランキングに挑戦。">
<meta property="og:url" content="https://yukiyuki071103-hash.github.io/keiba/keiba.html">
<meta property="og:image" content="https://yukiyuki071103-hash.github.io/keiba/keiba-ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* VOICE: 日曜午後の競馬場、場内実況と赤ペンの競馬新聞
   IDEA: 出馬表とマークカードを手にした、スタンド前のベンチ
   PICTURE: 内馬場から追う側面視点のドット絵中継（芝の縞、ハロン棒、ゴール板）
   COLOUR and TYPE: 深い緑の芝色、金の数字、枠番8色 / DotGothic16 + 角ゴシック
   LAYOUT: 縦1列、最大560px、出馬表→馬券→中継→結果 */
:root{--bg:#0b1a14;--panel:#10261d;--panel2:#173527;--line:#2a5240;--text:#eef6f0;--muted:#97b8a6;--gold:#f2c94c;--red:#ff6b6b;--green:#4cd38a;--cyan:#6fd6c0;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;overflow-x:clip}
.px,header h1,.comm,.big,.rn,.rname,.result h3,.ttl,.kim,.modal h3{font-family:"DotGothic16",monospace}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 80px}
header{display:flex;align-items:center;gap:8px;padding:4px 2px 10px;position:sticky;top:0;background:linear-gradient(var(--bg) 80%,#0b1a1400);z-index:5}
header h1{font-size:16px;overflow:hidden;text-overflow:ellipsis;margin:0;letter-spacing:.04em;flex:1;cursor:pointer;white-space:nowrap}
.modechip{font-size:11px;color:var(--cyan);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.bal{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;white-space:nowrap;font-size:14px}
.bal b{color:var(--gold)}
.ibtn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 10px;font-size:13px;min-height:36px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card h2{font-size:13px;margin:0 0 10px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.raceinfo{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;position:relative}
.rn{font-size:22px;font-weight:800}.rname{font-size:17px;color:var(--gold)}
.rname.g1{color:#ffe27a;text-shadow:0 0 8px #f2c94c88}
.rmode{position:absolute;right:0;top:2px;font-size:11px;color:var(--cyan);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.meta{color:var(--muted);font-size:12px;width:100%}
.cond{display:flex;flex-wrap:wrap;gap:5px;width:100%;margin-top:4px}
.cond span{font-size:12px;background:var(--panel2);border-radius:6px;padding:2px 7px;white-space:nowrap}
.cond .tf{background:#2f7a3a}.cond .dt{background:#8a6238}
table{width:100%;border-collapse:collapse}
th,td{padding:6px 3px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:middle}
th{color:var(--muted);font-weight:500;font-size:11px}
td.num,th.num{text-align:right;white-space:nowrap}
.waku{display:inline-flex;width:26px;height:26px;border-radius:6px;align-items:center;justify-content:center;font-weight:800;font-size:14px;border:1px solid rgba(0,0,0,.4);flex:none}
.w1{background:#f4f4f4;color:#111}.w2{background:#1b1b1b;color:#fff;border-color:#667}.w3{background:#e53935;color:#fff}.w4{background:#2a5cff;color:#fff}.w5{background:#f5d40f;color:#111}.w6{background:#22b35e;color:#fff}.w7{background:#ff8a1c;color:#111}.w8{background:#ff8fc4;color:#111}
.hname{font-weight:700;white-space:nowrap}
.sub{color:var(--muted);font-size:11px;display:block;white-space:nowrap}
.tp{display:inline-block;font-size:12px;padding:3px 5px;white-space:nowrap;font-weight:700;border-radius:6px;background:var(--panel2);color:var(--muted)}
.tp.up{color:#ffe08a;background:#3a3214}.tp.dn{color:#9fc4ff;background:#1a2a40}
.ewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -12px;padding:0 12px;scrollbar-width:thin}
.etab{min-width:620px;border-collapse:separate;border-spacing:0}
.etab th,.etab td{white-space:nowrap}
.etab .st1{position:sticky;left:0;background:var(--panel);z-index:2;width:34px;min-width:34px}
.etab .st2{position:sticky;left:34px;background:var(--panel);z-index:2;box-shadow:6px 0 6px -5px #000a;padding-right:8px}
.etab .pm{text-align:center;width:36px;font-size:17px;font-weight:800;color:var(--muted);background:#f4f1e608;border-left:1px dotted var(--line)}
.etab th.pm{font-size:10px;font-weight:600;color:var(--muted)}
.etab .pm.hon{background:#f2c94c14}.etab th.pm.hon{color:var(--gold)}
.etab .pm.m1{color:#ff6b6b}.etab .pm.m2{color:#7fb2ff}.etab .pm.m3{color:#d8d2c0}
.mark{font-size:16px;color:var(--red);text-align:center;width:20px;font-weight:800}
.odds{font-weight:800;color:var(--gold)}
.pop1{color:var(--red)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.seg{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:6px;margin-bottom:8px}.seg .tab{font-size:12px;white-space:nowrap;padding:9px 2px}
.tab{padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:13px;font-weight:700;min-height:40px}
.tab.on{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.seg .tab.on{background:var(--cyan);border-color:var(--cyan);color:#06221c}
.hint{color:var(--muted);font-size:12px;margin:0 0 8px;line-height:1.5}
.mrow{display:flex;align-items:center;gap:5px;margin-bottom:6px}
.lblbtn{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:8px;height:42px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;font-size:11px!important}.lblbtn b{color:var(--cyan);font-size:13px}.lblbtn.on{border-color:var(--cyan);background:#0f3a32}
.mrow .lbl{width:34px;font-size:11px;color:var(--muted);flex:none;line-height:1.2}
.mrow .bx{flex:1;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:3px}
.bb{height:42px;border-radius:8px;border:2px solid var(--line);background:var(--panel2);display:flex;align-items:center;justify-content:center;padding:0}
.bb.on{border-color:var(--gold);background:#3a3417}
.bb .waku{width:24px;height:24px;font-size:13px}
.bx.many .bb .waku{width:20px;height:22px;font-size:11px;border-radius:5px}
.preview{background:var(--panel2);border-radius:10px;padding:8px 10px;margin:4px 0 10px;font-size:14px;min-height:20px}
.amt{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.amt input{width:130px;padding:9px;border-radius:10px;border:1px solid var(--line);background:#06120d;color:var(--text);font-size:16px;text-align:right}
.chip{padding:8px 9px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:13px;min-height:38px}
.btn{width:100%;padding:13px;border-radius:12px;border:0;font-size:16px;font-weight:800;background:var(--gold);color:#1a1a1a;min-height:48px}
.btn:disabled{opacity:.4}
.btn.go{background:var(--green);color:#062312;font-size:18px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:600}
.btn.cyan{background:var(--cyan);color:#06221c}
.btn.sm{padding:9px;font-size:14px;min-height:40px}
.grp{border-bottom:1px dashed var(--line);padding:8px 0}
.grp:last-child{border-bottom:0}
.grp .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.grp .t1{font-weight:700}.grp .t2{color:var(--muted);font-size:12px}
.grp .x{background:none;border:0;color:var(--muted);font-size:18px;padding:6px 10px;min-height:40px}
.grp.win .t1{color:var(--gold)}.grp.lose{opacity:.6}
.clist{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.clist span{font-size:12px;background:var(--panel2);border-radius:6px;padding:2px 6px;white-space:nowrap}
.clist .w{background:#5a4a12;color:var(--gold)}.clist .r{background:#24504a;color:var(--cyan)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:8px}
.total{display:flex;justify-content:space-between;padding-top:10px;font-weight:700}
.racebox{position:relative}
canvas.race{width:100%;display:block;border-radius:10px;background:#7cc4ff;image-rendering:pixelated;image-rendering:crisp-edges}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;gap:6px}
.kim{font-size:32px;color:#fff;text-shadow:0 2px 0 #000,0 0 12px #000;letter-spacing:.1em}
.ordline{display:flex;gap:4px;background:#000a;padding:6px 10px;border-radius:10px}
.comm{margin-top:8px;font-size:16px;min-height:44px;text-align:center;color:var(--gold);line-height:1.4}
.live{margin-top:4px;font-size:13px;color:var(--text);text-align:center;min-height:18px;font-family:"DotGothic16",monospace}
.result h3{margin:0 0 8px;font-size:17px}
.rank{display:grid;grid-template-columns:30px 28px minmax(0,1fr) auto;gap:2px 6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.rank .pos{font-weight:800;text-align:center;font-family:"DotGothic16",monospace}
.rank .rt{text-align:right;font-size:12px;white-space:nowrap}
.rank .rt small{display:block;color:var(--muted);font-size:11px}
.big{font-size:28px;text-align:center;margin:8px 0}
.big.plus{color:var(--gold)}.big.minus{color:var(--muted)}
.kimbig{font-size:20px;text-align:center;margin:6px 0 10px;color:var(--cyan);font-family:"DotGothic16",monospace}
.note{font-size:12px;color:var(--cyan);background:#0f2e28;border-radius:8px;padding:6px 8px;margin:6px 0;line-height:1.5}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1}
footer{color:var(--muted);font-size:11px;text-align:center;margin-top:16px;line-height:1.6}
.yoso{display:flex;gap:10px;align-items:flex-start}
.yoso canvas{width:56px;height:56px;image-rendering:pixelated;flex:none;border-radius:10px;background:#244a36}
.bubble{position:relative;background:#f4f1e6;color:#1a1a1a;border-radius:12px;padding:8px 10px;font-size:14px;flex:1;line-height:1.5}
.bubble:before{content:"";position:absolute;left:-7px;top:16px;border:7px solid transparent;border-right-color:#f4f1e6;border-left:0}
.bubble b{color:#c62828}
.yname{font-size:11px;color:var(--muted);margin-top:4px;text-align:center;white-space:nowrap}
.title{padding-top:6px}
.ttl{font-size:36px;line-height:1.1;text-align:center;margin:14px 0 4px;color:#fff;text-shadow:0 3px 0 #1f6a3a}
.ttlsub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:12px}
canvas.hero{width:100%;display:block;border-radius:14px;image-rendering:pixelated;margin-bottom:14px}
.mode{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;color:var(--text)}
.mode .mt{font-family:"DotGothic16",monospace;font-size:20px;display:flex;justify-content:space-between;align-items:baseline}
.mode .mt small{font-size:13px;color:var(--gold);font-family:inherit}
.mode p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
.mode.day{border-color:#7a6620}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:14px 14px 24px}
.modal.center{align-items:center}.modal.center .sheet{border-radius:16px;margin:12px;max-width:420px}
.modal h3{margin:0 0 10px;font-size:19px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal h2{font-size:13px;color:var(--muted);font-weight:600}
.acct{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:4px 0 12px;font-size:14px}
.me td{color:var(--gold)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kv div{background:var(--panel2);border-radius:10px;padding:8px}
.kv small{display:block;color:var(--muted);font-size:11px}
.kv b{font-size:17px;font-family:"DotGothic16",monospace}
.btnrow{display:flex;gap:8px;margin-top:12px}
.otab{table-layout:fixed;font-family:"DotGothic16",monospace}.otab th,.otab td{padding:5px 0;text-align:center;font-size:10px;border:1px solid var(--line)}
.otab th .waku{width:18px;height:18px;font-size:10px}.otab thead th:first-child{font-size:8px;font-family:inherit;color:var(--muted)}
.oc{cursor:pointer;color:var(--text)}.oc.na{background:#081610;cursor:default}.oc.h10,.pi.h10 b,.h10t{color:var(--gold)}.oc.h3{background:#5a1f26;color:#ffd0d0;font-weight:700}.h3t{color:#ff9a9a}
.fpick{display:grid;grid-template-columns:auto repeat(var(--n),minmax(0,1fr));gap:3px;align-items:center;margin-bottom:8px}.fpick .bb{height:34px}.fpick .waku{width:20px;height:20px;font-size:11px}
.plist{display:grid;grid-template-columns:1fr 1fr;gap:4px}.pi{display:flex;align-items:center;gap:6px;background:var(--panel2);border-radius:8px;padding:5px 7px;cursor:pointer}.pi small{color:var(--muted);width:18px;font-size:10px}.pi span{display:flex;gap:1px}.pi .waku{width:20px;height:20px;font-size:11px}.pi b{margin-left:auto;font-family:"DotGothic16",monospace}.pi.h3{background:#5a1f26}.pi.h3 b{color:#ffd0d0}
.hl{cursor:pointer;text-decoration:underline dotted #5a9978;text-underline-offset:3px}
.apt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}.apt div{background:var(--panel2);border-radius:8px;padding:6px;text-align:center}.apt small{display:block;color:var(--muted);font-size:11px}.apt b{font-size:20px;color:var(--gold)}
.form{display:flex;gap:5px;flex-wrap:wrap}.form span{background:var(--panel2);border-radius:6px;padding:3px 8px;font-family:"DotGothic16",monospace}.form .p1{color:var(--gold)}.form .p3{color:#e0d6c0}
.fanf{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0008;color:#fff;font-family:"DotGothic16",monospace;font-size:20px;text-align:center;border-radius:10px;line-height:1.5}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:25;width:100%;height:100%}
.jack{position:fixed;left:0;right:0;top:35%;text-align:center;font-family:"DotGothic16",monospace;font-size:48px;color:var(--gold);text-shadow:0 4px 0 #6b4a00,0 0 20px #000;z-index:26;pointer-events:none}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
<script src="keiba-firebase-config.js"></script>
<!-- keiba 用の設定がないときは、同じFirebaseを使う競輪版の設定を読む -->
<script src="https://yukiyuki071103-hash.github.io/keirin/keirin-firebase-config.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="hTitle" title="タイトルへ"></h1>
    <span class="modechip hidden" id="modeChip"></span>
    <button class="ibtn" id="sndBtn" aria-label="効果音"></button>
    <button class="ibtn hidden" id="statsBtn">成績</button>
    <div class="bal hidden" id="balBox"><b id="bal">0</b>円</div>
  </header>

  <section id="titleScr" class="title">
    <div class="ttl" id="tTitle"></div>
    <div class="ttlsub" id="tSub"></div>
    <canvas class="hero" id="hero"></canvas>
    <div id="modeList"></div>
    <div id="acct" class="acct"></div>
    <button class="btn ghost" id="rankOpen">🏆 今日のランキング（1日モード）</button>
  </section>

  <section id="gameScr" class="hidden">
    <div class="card">
      <div class="raceinfo">
        <span class="rn" id="rnum">1R</span>
        <span class="rname" id="rname"></span>
        <span class="rmode" id="rmode"></span>
        <div class="cond" id="rcond"></div>
      </div>
    </div>

    <div class="card" id="yosoCard">
      <div class="yoso">
        <div><canvas id="face" width="16" height="16"></canvas><div class="yname" id="yName"></div></div>
        <div class="bubble" id="yText"></div>
      </div>
      <button class="btn sm cyan" id="yBuy" style="margin-top:10px">この買い目を買う</button>
    </div>

    <div class="card" id="entryCard">
      <h2>出馬表 <small style="font-weight:400">（横にスライドで新聞の印・馬体重 ／ 馬名をタップで適性）</small></h2>
      <div class="ewrap"><table class="etab">
        <thead id="entHead"></thead>
        <tbody id="entries"></tbody>
      </table></div>
    </div>

    <div class="card" id="betCard">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h2 style="margin:0">馬券を買う</h2><button class="chip" id="oddsBtn">📋 オッズ表</button></div>
      <div class="tabs" id="tabs"></div>
      <div class="seg" id="seg"></div>
      <p class="hint" id="hint"></p>
      <div id="sheet"></div>
      <div class="preview" id="preview"></div>
      <div class="amt">
        <input id="amount" type="number" inputmode="numeric" min="100" step="100" value="100" aria-label="1点あたりの金額">
        <span>円 / 1点</span>
        <span id="chips" style="display:contents"></span>
        <button class="chip" id="amtReset">リセット</button>
      </div>
      <button class="btn" id="addBtn" disabled>この馬券を買う</button>
    </div>

    <div class="card" id="ticketCard">
      <h2>購入した馬券</h2>
      <div id="tickets"></div>
      <div class="total"><span>合計</span><span id="ttotal">0 円</span></div>
    </div>

    <button class="btn go" id="startBtn">🏁 発走！</button>
    <button class="btn cyan hidden" id="reviveBtn" style="margin-top:10px"></button>
    <button class="btn ghost sm hidden" id="dayRestart" style="margin-top:10px">この挑戦をやめて最初からやり直す</button>

    <div class="card hidden" id="raceCard" style="margin-top:12px">
      <div class="racebox">
        <canvas class="race" id="cv"></canvas>
        <div class="overlay hidden" id="ovl"></div>
        <div class="fanf hidden" id="fanf"></div>
      </div>
      <div class="comm" id="comm"></div>
      <div class="live" id="live"></div>
      <button class="btn ghost sm" id="skipBtn" style="margin-top:8px">結果まで飛ばす</button>
    </div>

    <div class="card result hidden" id="resultCard">
      <h3>🏁 レース結果</h3>
      <div class="kimbig" id="rKim"></div>
      <div id="ranks"></div>
      <div id="rNote"></div>
      <h2 style="margin-top:12px">払戻金（100円あたり）</h2>
      <table><tbody id="payouts"></tbody></table>
      <h2 style="margin-top:12px">あなたの収支</h2>
      <div id="myResult"></div>
      <div class="yoso" style="margin-top:10px"><canvas id="face2" width="16" height="16"></canvas><div class="bubble" id="yReact"></div></div>
      <button class="btn" id="nextBtn" style="margin-top:12px">次のレースへ ▶</button>
    </div>
  </section>

<script>
{
// ===== 競馬エンジン（馬・騎手・展開シミュレーション・オッズ・精算） =====
const ENG = (() => {
  function hashStr(s){ let h=1779033703^s.length; for(let i=0;i<s.length;i++){ h=Math.imul(h^s.charCodeAt(i),3432918353); h=h<<13|h>>>19; } h=Math.imul(h^(h>>>16),2246822507); h=Math.imul(h^(h>>>13),3266489909); return (h^=h>>>16)>>>0; }
  function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function makeRng(seed){
    const r=mulberry(typeof seed==='number'?seed:hashStr(String(seed)));
    r.range=(a,b)=>a+r()*(b-a); r.int=(a,b)=>Math.floor(a+r()*(b-a+1)); r.pick=a=>a[Math.floor(r()*a.length)];
    r.gauss=()=>{let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
    r.shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
    r.wpick=(arr,ws)=>{const t=ws.reduce((a,b)=>a+b,0);let x=r()*t;for(let i=0;i<arr.length;i++){x-=ws[i];if(x<=0)return arr[i];}return arr[arr.length-1];};
    return r;
  }
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

  // ---- 名前 ----
  const NA=['ドット','ピクセル','ネオン','ギンガ','ハヤテ','ソラノ','ユメノ','ホシノ','ツキノ','アカツキ','カゼノ','ミナモ','コハク','ルリイロ','ヒスイ','サンゴ','ラムネ','ビスケ','マロン','モカ','ショコラ','チェリー','レモン','ミント','ブリキ','カラクリ','ゼンマイ','ハグルマ','キラリ','ピカリ','ズンズン','ポップ','ノヴァ','オーロラ','コメット','メテオ','トンボ','ホタル','ツバメ','カモメ','アサギ','ユキミ','ハナビ','カザミ','シズク','ヒナタ','コガネ','シロガネ','クロガネ','アカネ','モエギ','スミレ','ツツジ','カエデ','ナギサ','イカヅチ','ムラクモ','カスミ','オボロ','サザナミ','トキワ','ワカバ','ヨツバ','フタバ','ハルカゼ','ナツゾラ','アキバレ','フユビ','ユウヒ','アサヒ','ホクト','カペラ','デネブ','ベガ','リゲル','ミラ'];
  const NB=['ボルト','クラウン','ハート','ロード','キング','クイーン','エース','ジェット','ダンサー','ランナー','フォルテ','ブレイブ','スピカ','オーラ','ドリーム','ソード','ウイング','リーフ','フレア','マーチ','ワルツ','タンゴ','ビート','リズム','ロケット','トレイン','エンジン','パレード','フェスタ','ミラクル','ラッシュ','ダッシュ','スター','ムーン','サン','レイ','ルーチェ','ステラ','バンビ','タイフーン','ブリーズ','ストーム','サンダー','ファイア','ノーツ','メロディ','ソナタ','カノン','フーガ','ボレロ','ポルカ','シャイン','グロウ','スパーク','ギア','ボイジャー','パイロット','セイル','アンカー','コンパス','トレジャー','ジュエル','パール','ルビー','トパーズ','オパール','ハーモニー','ステップ','ジャンプ','ターボ','ブースト','ギャロップ','グリフォン','ドラゴン','ワンダー','ギフト'];
  const JSEI=['赤坂','岩永','大塚','小倉','片岡','北川','黒田','小松','坂口','佐野','柴田','新田','杉本','関口','高木','田村','長尾','中島','西岡','野口','橋本','早川','平井','藤原','松岡','宮下','村井','森本','山口','吉村'];
  const JMEI=['健太','翔太','大樹','拓也','雄一','裕介','直樹','亮','俊','剛','誠','隆之','康平','匠','颯','蓮','慎吾','智之','将','輝','優','航','大地','一真','龍','大輔','和也','達也','雄太','光'];
  // 騎手30人（固定）。上位ほど腕が良い
  const JOCKEYS=(()=>{ const r=makeRng('pocket-jockey-v1'); const sei=r.shuffle(JSEI); return sei.map((s,i)=>({name:s, full:s+' '+r.pick(JMEI), sk:Math.round((0.28-i*0.017+r.gauss()*0.02)*100)/100})); })();
  const COATS=[['鹿毛','#8a5a2b','#5e3b1a','#2b1a0e',30],['黒鹿毛','#5a3a22','#3a2414','#1a100a',20],['青鹿毛','#3a2c2a','#221816','#0e0a0a',10],['栗毛','#b8692e','#8a4c1f','#e0a860',22],['芦毛','#c4c4c4','#9a9a9a','#eeeeee',10],['青毛','#26262c','#141418','#0a0a0c',6],['栃栗毛','#9a5a2a','#6e3e1c','#c89058',2]];
  const SILK=['#e53935','#1e88e5','#43a047','#fdd835','#8e24aa','#fb8c00','#ffffff','#212121','#00acc1','#d81b60','#6d4c41','#3949ab','#c0ca33','#f06292'];
  const STYLES=['逃','先','差','追'];
  const STYLE_NAME={'逃':'逃げ','先':'先行','差':'差し','追':'追込'};

  // ---- 券種 ----
  const BET_TYPES=[
    {id:'tan',  name:'単勝',  k:1, ordered:true,  T:0.80,  desc:'1着になる馬を当てる（複数選ぶとそれぞれ1点）'},
    {id:'fuku', name:'複勝',  k:1, ordered:true,  T:0.80,  desc:'3着までに入る馬を当てる（複数選ぶとそれぞれ1点）'},
    {id:'waku', name:'枠連',  k:2, ordered:false, T:0.775, waku:true, desc:'1・2着の枠番の組み合わせ（順不同）。同じ枠に2頭いる枠はゾロ目も買える'},
    {id:'uren', name:'馬連',  k:2, ordered:false, T:0.775, desc:'1・2着の2頭を当てる（順不同）'},
    {id:'utan', name:'馬単',  k:2, ordered:true,  T:0.75,  desc:'1着→2着を順番通りに当てる'},
    {id:'wide', name:'ワイド',k:2, ordered:false, T:0.775, desc:'3着までに入る2頭を当てる（順不同）'},
    {id:'sfuku',name:'3連複', k:3, ordered:false, T:0.75,  desc:'1〜3着の3頭を当てる（順不同）'},
    {id:'stan', name:'3連単', k:3, ordered:true,  T:0.725, desc:'1着→2着→3着を順番通りに当てる'},
  ];
  const keyO=a=>a.join('-'), keyU=a=>[...a].sort((x,y)=>x-y).join('=');
  const keyOf=(bt,a)=>bt.k===1?String(a[0]):bt.ordered?keyO(a):keyU(a);
  // 枠番（8枠。9頭以上は外の枠から2頭ずつ）
  function wakuOf(N,no){ if(N<=8) return no; const single=16-N; return no<=single?no:single+Math.ceil((no-single)/2); }

  // ---- 番組（1日12R） ----
  const CLASSES={
    shinba:{name:'2歳新馬',base:0,age:'2'}, mi2:{name:'2歳未勝利',base:0.15,age:'2'}, mi3:{name:'3歳未勝利',base:0.2,age:'3'},
    c1:{name:'1勝クラス',base:0.75,age:'3up'}, c2:{name:'2勝クラス',base:1.35,age:'3up'}, c3:{name:'3勝クラス',base:1.95,age:'3up'},
    g3:{name:'GⅢ',base:2.7,age:'3up',grade:'GⅢ'}, g2:{name:'GⅡ',base:3.0,age:'3up',grade:'GⅡ'}, g1:{name:'GⅠ',base:3.4,age:'3up',grade:'GⅠ'},
  };
  const CARD=['mi2','mi3','mi3','c1','shinba','c1','c1','c2','c2','c3','main','c2'];
  const SPECIAL=['すずらん','こもれび','ほしぞら','はつゆき','あおば','ゆうなぎ','つきみ','もみじ','あさがお','いなほ','わたぐも','しおさい'];
  const MAIN=['ポケット記念','ドットダービー','ピクセル大賞典','ネオンカップ','ギャラクシー賞','ビット杯','ハロンの女王杯','ゼンマイ記念'];
  function raceCond(seed,no){
    const r=makeRng(seed+'cond');
    let ck=CARD[(no-1)%12];
    if(ck==='main') ck=r.wpick(['g1','g2','g3'],[3,3,4]);
    const C=CLASSES[ck];
    const surf = C.grade ? (r()<0.8?'芝':'ダ') : (r()<0.55?'芝':'ダ');
    const D = surf==='芝' ? r.pick(C.grade?[1600,2000,2400,1200,1800,2200]:[1200,1400,1600,1800,2000,2200,2400]) : r.pick(C.grade?[1400,1600,1800,2100]:[1200,1400,1700,1800,2100]);
    const sky=r.wpick(['晴','曇','雨','小雨'],[55,28,10,7]);
    const going = sky==='雨' ? r.wpick(['稍重','重','不良'],[3,4,2]) : sky==='小雨' ? r.wpick(['良','稍重','重'],[3,4,2]) : r.wpick(['良','稍重','重'],[85,12,3]);
    let name=C.name;
    if(ck.startsWith('g')) name=r.pick(MAIN)+'（'+C.grade+'）';
    else if(no%12===9||no%12===10||no%12===0) name=r.pick(SPECIAL)+(no%12===10?'ステークス':'特別')+'（'+C.name+'）';
    const N = C.grade ? r.int(11,12) : r.wpick([8,9,10,11,12],[1,2,3,3,3]);
    return {ck, cls:C.name, base:C.base, age:C.age, grade:C.grade||'', surf, D, sky, going, name, N, main:!!C.grade};
  }

  // ---- 出走馬 ----
  function genField(rng, cond){
    const N=cond.N, used=new Set(), horses=[];
    for(let i=0;i<N;i++){
      let name; do{ name=rng.pick(NA)+rng.pick(NB); }while(used.has(name)||name.length>9); used.add(name);
      const ab=cond.base+rng.gauss()*0.47;
      const style=rng.wpick(STYLES,[15,35,32,18]);
      const dp=clamp(Math.round((cond.D+rng.gauss()*420)/200)*200,1000,3000);
      const ss=rng(); const sp = cond.surf==='芝' ? (ss<0.82?'芝':ss<0.94?'両':'ダ') : (ss<0.8?'ダ':ss<0.93?'両':'芝');
      const gp=Math.round(rng.gauss()*0.5*100)/100;
      const age = cond.age==='2'?2 : cond.age==='3'?3 : rng.wpick([3,4,5,6,7],[3,4,3,2,1]);
      const sex = rng.wpick(['牡','牝','セ'],[56,36,age>=4?8:0]);
      let kin = age===2?55 : cond.age==='3'?57 : age===3?55:57; if(cond.grade==='GⅠ'&&age>=4) kin=58; if(sex==='牝') kin-=2;
      const coat=rng.wpick(COATS,COATS.map(c=>c[4]));
      const w=Math.round(rng.range(426,532)/2)*2, wd=Math.round(rng.gauss()*5/2)*2;
      // 強い馬ほど上手い騎手が乗りやすい
      const jz=clamp(Math.round(((1-(ab-cond.base+1.2)/2.4))*29+rng.gauss()*6),0,29);
      const jk=JOCKEYS[jz];
      const form = cond.ck==='shinba' ? [] : Array.from({length:Math.min(5,(age-1)*2+rng.int(0,2))},()=>clamp(Math.round((1-1/(1+Math.exp(-((ab-cond.base)*1.5+rng.gauss()*0.9))))*13+1),1,16)).slice(0,5);
      horses.push({name, ab, style, dp, sp, gp, age, sex, kin, coat:coat[0], cc:[coat[1],coat[2],coat[3]], w, wd, jk:jk.name, jfull:jk.full, js:jk.sk,
        silk:[rng.pick(SILK),rng.pick(SILK)], form, gb:rng()<0.12});
    }
    const nos=rng.shuffle(Array.from({length:N},(_,i)=>i+1));
    horses.forEach((h,i)=>{ h.no=nos[i]; h.waku=wakuOf(N,h.no); });
    horses.sort((a,b)=>a.no-b.no);
    return {horses, N, cond};
  }
  // 条件への適性（距離・芝ダート・馬場）
  function fit(h, c){
    const dd=(c.D-h.dp)/700, d=-dd*dd*0.75;
    const s = h.sp==='両'?-0.05 : h.sp===c.surf?0:-0.75;
    const gl={'良':0,'稍重':0.4,'重':0.8,'不良':1.1}[c.going];
    return {d, s, g:h.gp*0.35*gl, all:d+s+h.gp*0.35*gl};
  }
  const PACE={H:{'逃':-0.6,'先':-0.25,'差':0.22,'追':0.35}, M:{'逃':-0.05,'先':0.05,'差':0.05,'追':-0.05}, S:{'逃':0.35,'先':0.2,'差':-0.1,'追':-0.35}};
  const E0={'逃':3,'先':2,'差':1,'追':0};

  // ---- 展開シミュレーション（1レース分） ----
  function sim(field, rng, excl){
    const c=field.cond, H=field.horses.filter(h=>h.no!==excl), N=H.length;
    const pv=H.reduce((a,h)=>a+(h.style==='逃'?1:h.style==='先'?0.3:0),0)+rng.gauss()*0.6;
    const pace=pv>3.3?'H':pv<2.0?'S':'M';
    const early={}, perf={}, deo=[];
    H.forEach(h=>{
      let e=E0[h.style]+rng.gauss()*0.55+(field.N-h.no)/field.N*0.25;
      let p=(h.ab-c.base)+(h.fitAll||0)+PACE[pace][h.style]+h.js+rng.gauss()*0.9+(c.D<=1400?((field.N+1)/2-h.no)/field.N*0.3:0)-(h.kin-55)*0.03;
      if(rng()<(h.gb?0.16:0.025)){ e-=4; p-=0.35; deo.push(h.no); }
      early[h.no]=e; perf[h.no]=p;
    });
    const nos=H.map(h=>h.no);
    const eo=[...nos].sort((a,b)=>early[b]-early[a]);
    const order=[...nos].sort((a,b)=>perf[b]-perf[a]);
    const er={}, pr={}; eo.forEach((n,i)=>er[n]=i/N); order.forEach((n,i)=>pr[n]=i/N);
    const c4s={}; nos.forEach(n=>{ const up=pr[n]<er[n]; c4s[n]=er[n]+(pr[n]-er[n])*(up?0.15:0.6)+rng.gauss()*0.02; });
    const c4=[...nos].sort((a,b)=>c4s[a]-c4s[b]);
    return {order, early:eo, c4, pace, deo, perf};
  }
  function kimarite(s, w){
    const N=s.order.length, cr=s.c4.indexOf(w), erk=s.early.indexOf(w);
    if(cr===0&&erk===0) return '逃げ';
    if(erk>=N*0.6&&cr<=1) return 'まくり';
    if(cr<=Math.max(1,Math.round(N*0.2))) return '先行';
    if(cr<=N*0.6) return '差し';
    return '追い込み';
  }

  // ---- 確率（モンテカルロ）とオッズ ----
  function computeProbs(field, rng, NS){
    const N=field.N, cnt={}, w1=Array(N+1).fill(0);
    for(let i=0;i<NS;i++){ const o=sim(field,rng).order; const k=keyO(o.slice(0,3)); cnt[k]=(cnt[k]||0)+1; w1[o[0]]++; }
    const p0=Array.from({length:N},(_,i)=>Math.max(0.009,(w1[i+1]+0.5)/(NS+0.5*N))), ps=p0.reduce((a,b)=>a+b,0), p=p0.map(v=>v/ps);
    const pr={}; BET_TYPES.forEach(b=>pr[b.id]={});
    const wk=n=>field.horses[n-1].waku, ALPHA=300;
    for(let i=0;i<N;i++) for(let j=0;j<N;j++){ if(j===i)continue; for(let k=0;k<N;k++){ if(k===i||k===j)continue;
      const q=p[i]*p[j]/(1-p[i])*p[k]/(1-p[i]-p[j]);
      const a=[i+1,j+1,k+1], t=((cnt[keyO(a)]||0)+ALPHA*q)/(NS+ALPHA);
      pr.stan[keyO(a)]=t;
      const add=(o,key)=>o[key]=(o[key]||0)+t;
      add(pr.sfuku,keyU(a)); add(pr.utan,keyO([i+1,j+1])); add(pr.uren,keyU([i+1,j+1]));
      add(pr.waku,keyU([wk(i+1),wk(j+1)])); add(pr.tan,String(i+1));
      a.forEach(n=>add(pr.fuku,String(n)));
      [[i,j],[i,k],[j,k]].forEach(([x,y])=>add(pr.wide,keyU([x+1,y+1])));
    }}
    // 3頭目の重複で合計が増える分を正規化（単・馬連などは合計1になるよう）
    const S=Object.values(pr.stan).reduce((a,b)=>a+b,0);
    for(const id in pr) for(const k in pr[id]) pr[id][k]/=S;
    const win=Array(N+1).fill(0); for(const k in pr.tan) win[+k]=pr.tan[k];
    return {pr, win};
  }

  const MARG=[['ハナ',0.1],['アタマ',0.3],['クビ',0.6],['1/2馬身',1.2],['3/4馬身',1.8],['1馬身',2.4],['1 1/4馬身',3.0],['1 1/2馬身',3.6],['1 3/4馬身',4.2],['2馬身',4.8],['2 1/2馬身',6],['3馬身',7.2],['3 1/2馬身',8.4],['4馬身',9.6],['5馬身',12],['大差',26]];

  function genRace(seed, no){
    const rng=makeRng(seed), cond=raceCond(seed,no);
    const field=genField(rng,cond);
    field.horses.forEach(h=>{ const f=fit(h,cond); h.fit=f; h.fitAll=f.all; });
    const {pr,win}=computeProbs(field, makeRng(seed+'mc'), 9000);
    const odds={};
    for(const bt of BET_TYPES){ odds[bt.id]={}; for(const k in pr[bt.id]) odds[bt.id][k]=Math.min(99999.9,Math.max(1.0,Math.floor(bt.T/pr[bt.id][k]*10)/10)); }
    const pops=field.horses.map(h=>h.no).sort((a,b)=>win[b]-win[a]||a-b);
    field.horses.forEach(h=>{ h.pop=pops.indexOf(h.no)+1; h.win=win[h.no]; h.tan=odds.tan[String(h.no)]; h.fk=odds.fuku[String(h.no)]; });
    // ---- 事故と結果 ----
    const rr=makeRng(seed+'result');
    let acc=null; const xa=rr();
    if(xa<0.012) acc={type:'TOR', no:rr.int(1,cond.N)};
    const s=sim(field, rr, acc?acc.no:null);
    let cross=[...s.order];
    if(xa>=0.012&&xa<0.019){ const c=s.early[rr.int(2,s.early.length-1)]; acc={type:'CHU',no:c}; cross=cross.filter(n=>n!==c); s.c4=s.c4.filter(n=>n!==c); }
    let order=[...cross];
    if(xa>=0.019&&xa<0.031){ const i=rr.int(0,2); acc={type:'KOU',no:cross[i],over:cross[i+1]}; order[i]=cross[i+1]; order[i+1]=cross[i]; }
    const kimW=kimarite(s, order[0]);
    // 着差（ゴールを通過する順）
    const margins=[]; for(let i=1;i<cross.length;i++){ const r=rr(); let j;
      if(i===1) j=Math.floor(Math.pow(r,1.5)*12); else if(i===2) j=Math.floor(Math.pow(r,1.2)*12); else j=Math.min(14,Math.floor(r*9)+(i>cross.length*0.6?3:0));
      if(i===cross.length-1&&rr()<0.04) j=15;
      margins.push(MARG[j]); }
    // 走破タイムと上がり3F
    const spm=0.0560+(cond.D-1200)*0.0000045+(cond.surf==='ダ'?0.0035:0);
    const gl={'良':0,'稍重':1,'重':2,'不良':3}[cond.going];
    const wt=cond.D*spm*(1+(cond.surf==='芝'?0.005:-0.004)*gl)-cond.base*0.25+rr.gauss()*0.35+({H:-0.3,M:0,S:0.6}[s.pace]);
    const A0={H:35.9,M:35.0,S:34.2}[s.pace]+(cond.surf==='ダ'?1.4:0)+(cond.D>2000?0.4:0)-cond.base*0.12;
    const res={}; let cm=0;
    cross.forEach((n,i)=>{ if(i) cm+=margins[i-1][1]; const h=field.horses[n-1];
      res[n]={time:wt+cm/14, agari:Math.round((A0+0.5+rr.gauss()*0.25+{'逃':0.6,'先':0.3,'差':-0.2,'追':-0.5}[h.style]+i*0.07)*10)/10,
        pass:[s.early.indexOf(n)+1, s.c4.indexOf(n)+1]}; });
    if(acc&&acc.type==='CHU') res[acc.no]={pass:[s.early.indexOf(acc.no)+1]};
    tanpyo(field, makeRng(seed+'tp'));
    const yoso=makeYoso(rr, field, win, s);
    const papers=makePapers(makeRng(seed+'pp'), field, win, yoso);

  const TPS={}, TPG={}; for(const g in TG) TG[g][2].forEach(t=>{ TPS[t]=TG[g][0]; TPG[t]=g; });

  // ---- 新聞の印（記者ごとにクセがある） ----
  function makePapers(rng, field, win, yoso){
    const H=field.horses, c=field.cond, nE=H.filter(h=>h.style==='逃').length, pg=nE>=3?'H':nE===0?'S':'M';
    const mk=(list,M)=>{ const m={}; list.slice(0,M.length).forEach((n,i)=>m[n]=M[i]); return m; };
    const rank=f=>H.map(h=>({n:h.no,v:f(h)})).sort((a,b)=>b.v-a.v).map(x=>x.n);
    const M=['◎','○','▲','△','△'];
    const avgF=h=>h.form.length?h.form.slice(0,3).reduce((a,b)=>a+b,0)/Math.min(3,h.form.length):8;
    return [
      {name:'本紙', marks:yoso.marks},
      {name:'調教', marks:mk(rank(h=>(h.ab-c.base)+rng.gauss()*0.35),M)},
      {name:'データ', marks:mk(rank(h=>-avgF(h)/4+h.fitAll+rng.gauss()*0.3),M)},
      {name:'展開', marks:mk(rank(h=>Math.log(win[h.no]+1e-4)+PACE[pg][h.style]*1.5+rng.gauss()*0.3),M)},
      {name:'穴党', marks:mk(rank(h=>h.pop<=3?-99:h.fitAll+(h.ab-c.base)*0.6+rng.gauss()*0.5),['◎','○','▲','△'])},
    ];
  }

  // ---- 予想屋（印と買い目） ----
  function makeYoso(rng, field, win){
    const H=field.horses, nE=H.filter(h=>h.style==='逃').length;
    const sc=H.map(h=>({n:h.no, v:Math.log(win[h.no]+1e-4)+rng.gauss()*0.35})).sort((a,b)=>b.v-a.v);
    const M=['◎','○','▲','△','△'], marks={};
    sc.slice(0,5).forEach((x,i)=>marks[x.n]=M[i]);
    const hole=sc.slice(5).sort((a,b)=>(H[b.n-1].fitAll-H[a.n-1].fitAll))[0]; if(hole) marks[hole.n]='☆';
    const [h,t,a,d]=sc.map(x=>x.n);
    const picks=[[h,t,a],[h,t,d],[h,a,t],[h,a,d]].map(keyO);
    const hs=H[h-1].style;
    let text;
    if(nE>=3) text=`逃げ馬が${nE}頭おる。ペースは速なるで。`+(hs==='差'||hs==='追'?`後ろから来る◎${h}番の出番や。`:`それでも◎${h}番の力は抜けとる。`);
    else if(nE===1){ const e=H.find(x=>x.style==='逃').no; text=`ハナを切るのは${e}番だけ。楽に行けたら粘るで。`+(e===h?'◎はこの逃げ馬や。':`◎は${h}番。`); }
    else if(nE===0) text=`逃げ馬がおらん、スローになるで。前に行ける◎${h}番が有利や。`;
    else text=`流れは平均的。素直に力上位の◎${h}番から行くで。`;
    if(hole) text+=`☆${hole.n}番は条件ぴったりで一発あるで。`;
    return {marks, h, t, a, picks, text};
  }

  // ---- 買い目 ----
  function combos(bt, mode, rows, valid){
    let out=[];
    if(mode==='box'){
      const s=[...new Set(rows[0])].sort((a,b)=>a-b);
      const rec=(cur,rest)=>{ if(cur.length===bt.k){ out.push(cur); return; } rest.forEach((x,i)=>rec([...cur,x], bt.ordered? rest.filter((_,j)=>j!==i) : rest.slice(i+1))); };
      rec([],s);
    } else {
      const rec=(cur,i)=>{ if(i===bt.k){ out.push(cur); return; } for(const x of rows[i]||[]){ if(!cur.includes(x)||bt.waku) rec([...cur,x],i+1); } };
      rec([],0);
    }
    return [...new Set(out.map(a=>keyOf(bt,a)))].filter(k=>!valid||valid(k)).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  }
  function winKeys(race){
    const [a,b,c]=race.order, w=n=>race.horses[n-1].waku;
    return { tan:[String(a)], fuku:[a,b,c].map(String), waku:[keyU([w(a),w(b)])], uren:[keyU([a,b])], utan:[keyO([a,b])],
      wide:[keyU([a,b]),keyU([a,c]),keyU([b,c])], sfuku:[keyU([a,b,c])], stan:[keyO([a,b,c])] };
  }
  const per100=o=>Math.floor(o*100/10)*10;
  const payout=(amt,o)=>per100(o)*amt/100;
  function judge(race, btId, key){
    const ns=key.split(/[-=]/).map(Number), acc=race.acc;
    if(acc&&acc.type==='TOR'){
      if(btId==='waku'){ const cnt=w=>race.horses.filter(h=>h.waku===w&&h.no!==acc.no).length;
        const [x,y]=ns; if(x===y?cnt(x)<2:(cnt(x)<1||cnt(y)<1)) return 'refund'; }
      else if(ns.includes(acc.no)) return 'refund';
    }
    return winKeys(race)[btId].includes(key)?'win':'lose';
  }
  return {TG, TPG, makeRng, hashStr, genRace, raceCond, sim, kimarite, combos, winKeys, judge, payout, per100, BET_TYPES, keyO, keyU, keyOf, wakuOf, STYLE_NAME, JOCKEYS, MARG, fit};
})();

    t.n += gp.keys.length; t.hits += ghit; t.spent += cost; t.paid += gpay; t.refund += gref;

  st.hist.unshift({ r: r.label, order: r.order.slice(0, 3).join('-') + accTxt, spent, pay, ref }); st.hist = st.hist.slice(0, 10);

    const best = out.flatMap(g => g.keys.filter(k => g.st[k] === 'win').map(k => ({ amt: ENG.payout(g.unit, g.odds[k]), type: btById(g.bt).name, key: k, race: r.label }))).sort((a, b) => b.amt - a.amt)[0];

// ===== ランキング・ログイン（Firebase） =====
// 設定は keiba-firebase-config.js に書く（競輪版の設定をそのまま貼ってよい）。未設定のときはランキングなしで遊べる。
const FIREBASE_VERSION = '13.4.0';
const Net = {
  ready: null, fb: null, user: null, nick: null, listeners: [],
  cfg() { return window.KEIBA_FIREBASE_CONFIG || window.KEIRIN_FIREBASE_CONFIG; },
  configured() { const c = this.cfg(); return !!(c && c.apiKey && !/^ここ|YOUR/.test(c.apiKey)); },
  init() {
    this.ready = (async () => {
      if (!this.configured()) return;
      const B = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
      const [app, auth, fs] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-auth.js'), import(B + 'firebase-firestore.js')]);
      const a = app.initializeApp(this.cfg());
      this.fb = { auth, fs, A: auth.getAuth(a), D: fs.getFirestore(a) };
      await new Promise(res => { let first = true; auth.onAuthStateChanged(this.fb.A, async u => { this.user = u; this.nick = null; if (u) { try { await this.loadNick(); } catch (e) {} } if (first) { first = false; res(); } this.listeners.forEach(f => f()); }); });
    })().catch(e => { console.warn('Firebase init failed', e); this.fb = null; });
  },
  onChange(f) { this.listeners.push(f); },
  async ok() { try { await this.ready; } catch (e) {} return !!this.fb; },
  signedIn() { return !!this.user; },
  async signIn() {
    const { auth, A } = this.fb;
    await auth.signInWithPopup(A, new auth.GoogleAuthProvider());
  },
  async signOut() { await this.fb.auth.signOut(this.fb.A); },
  async loadNick() { const { fs, D } = this.fb; const s = await fs.getDoc(fs.doc(D, 'keirin_players', this.user.uid)); this.nick = s.exists() ? String(s.data().name || '') || null : null; },
  async setNick(name) { const { fs, D } = this.fb; await fs.setDoc(fs.doc(D, 'keirin_players', this.user.uid), { name }); this.nick = name; },
  // その日の自己ベストだけ記録する
  async submit(date, money) {
    const { fs, D } = this.fb; const ref = fs.doc(D, 'keiba_days', date, 'scores', this.user.uid);
    const s = await fs.getDoc(ref);
    if (s.exists() && Number(s.data().money) >= money) return 'lower';
    await fs.setDoc(ref, { name: this.nick, money: Math.floor(money), at: fs.serverTimestamp() });
    return 'ok';
  },
  async top(date, n) {
    const { fs, D } = this.fb;
    const snap = await fs.getDocs(fs.query(fs.collection(D, 'keiba_days', date, 'scores'), fs.orderBy('money', 'desc'), fs.limit(n)));
    return snap.docs.map(d => { const x = d.data(); return { id: d.id, name: String(x.name || ''), money: Number(x.money) || 0, at: x.at && x.at.toMillis ? x.at.toMillis() : 0 }; })
      .sort((a, b) => b.money - a.money || a.at - b.at);
  },
  async mine(date) {
    if (!this.user) return null;
    const { fs, D } = this.fb; const s = await fs.getDoc(fs.doc(D, 'keiba_days', date, 'scores', this.user.uid));
    if (!s.exists()) return null;
    const money = Number(s.data().money) || 0;
    const c = await fs.getCountFromServer(fs.query(fs.collection(D, 'keiba_days', date, 'scores'), fs.where('money', '>', money)));
    const all = await fs.getCountFromServer(fs.collection(D, 'keiba_days', date, 'scores'));
    return { money, rank: c.data().count + 1, total: all.data().count };
  },
};

      }
    };
    tick(); B.timer = setInterval(tick, 60); this.bgm = B;
  },
  bgmStop() {
    const B = this.bgm; if (!B) return; this.bgm = null; clearInterval(B.timer);
    try { const t = this.ctx.currentTime; B.g.gain.cancelScheduledValues(t); B.g.gain.setValueAtTime(B.g.gain.value, t); B.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4); setTimeout(() => { try { B.g.disconnect(); } catch (e) {} }, 600); } catch (e) {}
  },
  play(name) {
    if (!this.on || !this.ensure()) return;
    const c = this.ctx, t = c.currentTime + 0.01;
    if (name === 'gate') {         // ゲートが開く音
      const g = this.env(t, 0.7, 0.002, 0.18); this.noise(t, 0.25, 'bandpass', 2400, 1.5).connect(g).connect(this.out);
      this.tone('square', 180, t, 0.15, 0.002, 0.1);
    } else if (name === 'hoof') {  // 蹄の音
      [0, 0.09, 0.17].forEach((d, i) => { const g = this.env(t + d, 0.22 - i * 0.04, 0.003, 0.07); this.noise(t + d, 0.1, 'lowpass', 260, 1).connect(g).connect(this.out); });
    } else if (name === 'roar') {  // 直線の歓声
      const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 6.5); g.gain.setValueAtTime(0.3, t + 7.6); g.gain.exponentialRampToValueAtTime(0.0001, t + 10);
      this.noise(t, 10.1, 'bandpass', 700, 0.4).connect(g).connect(this.out);
      const g2 = c.createGain(); g2.gain.setValueAtTime(0.0001, t); g2.gain.exponentialRampToValueAtTime(0.1, t + 6.5); g2.gain.exponentialRampToValueAtTime(0.0001, t + 9.5);
      this.noise(t, 10.1, 'bandpass', 1900, 1.2).connect(g2).connect(this.out);
    } else if (name === 'win') {
      [523, 659, 784, 1047].forEach((f, i) => this.tone('square', f, t + i * 0.09, 0.09, 0.005, i === 3 ? 0.4 : 0.1));
    } else if (name === 'jackpot') {
      [523, 659, 784, 1047, 784, 1047, 1319, 1568].forEach((f, i) => this.tone('square', f, t + i * 0.11, 0.09, 0.005, i === 7 ? 0.8 : 0.12));
      [262, 392, 523].forEach(f => this.tone('triangle', f, t + 0.77, 0.12, 0.01, 1.0));
    }
  },
};
const SND_L = [['🔇', '音：オフ'], ['🔊', '効果音とファンファーレ'], ['🎵', '効果音＋BGM']];

document.addEventListener('visibilitychange', () => { if (document.hidden) Sound.bgmStop(); else if (phase === 'bet') Sound.bgmStart('bet'); else if (phase === 'result') Sound.bgmStart('res'); });

// ===== モーダル・トースト =====
function openModal(html, opt = {}) { $('sheetBox').onclick = null; $('sheetBox').innerHTML = html; $('modal').classList.remove('hidden'); $('modal').classList.toggle('center', !!opt.center); $('sheetBox').scrollTop = 0; }
function closeModal() { $('modal').classList.add('hidden'); $('sheetBox').innerHTML = ''; }
$('modal').onclick = e => { if (e.target.closest('[data-close]') || e.target === $('modal')) closeModal(); };
function confirmBox(msg, ok, cb) {
  openModal(`<h3>確認</h3><p>${msg}</p><div class="btnrow"><button class="btn ghost sm" data-close>やめる</button><button class="btn sm" id="cfOk">${ok}</button></div>`, { center: true });
  $('cfOk').onclick = () => { closeModal(); cb(); };
}
let tt; function toast(s) { const el = $('toast'); el.textContent = s; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2000); }

// ===== 大当たり演出 =====
function jackpot() {
  const c = $('confetti'), g = c.getContext('2d'); c.classList.remove('hidden'); $('jack').classList.remove('hidden');
  c.width = innerWidth; c.height = innerHeight;
  const P = Array.from({ length: 160 }, () => ({ x: Math.random() * c.width, y: -Math.random() * c.height * 0.6, v: 2 + Math.random() * 4, w: Math.random() * 6.28, col: ['#f2c94c', '#ffe58a', '#fff3c4', '#d4a017', '#ffffff'][Math.random() * 5 | 0] }));
  const t0 = performance.now();
  (function f(now) { const t = (now - t0) / 1000; g.clearRect(0, 0, c.width, c.height);
    P.forEach(p => { p.y += p.v; p.x += Math.sin(t * 3 + p.w) * 1.5; g.fillStyle = p.col; g.fillRect(p.x | 0, p.y | 0, 6, Math.abs(Math.sin(t * 6 + p.w)) * 6 + 2); });
    if (t < 3.6) requestAnimationFrame(f); else { c.classList.add('hidden'); $('jack').classList.add('hidden'); } })(t0);
}

// ===== 予想屋の顔（ドット絵・ハンチング帽に赤ペン） =====
const FACE = ['................', '....HHHHHHHH....', '...HHHHHHHHHH...', '..HBBBBBBBBBBHH.', '..HHHHHHHHHHHHHH', '..SSSSSSSSSSSSHH', '.SSKKKSSSSKKKSS.', '.SSSESSSSSSESSSP', 'SSSSSSSSSSSSSSPP', '.SSSSSSNNSSSSPG.', '.SSSSSSSSSSSSS..', '.SSSDDDDDDDSSS..', '..SSSMMMMMSSS...', '...SSSSSSSSS....', '....CCCCCCCC....', '..CCCCCCCCCCCC..'];
const FCOL = { H: '#7a5a32', B: '#a9874f', K: '#2a2a2a', S: '#f1c27d', E: '#1a1a1a', N: '#d9a066', D: '#5a3a1a', M: '#b33a3a', P: '#e53935', G: '#f2d08a', C: '#3b6e4a' };
function drawFace(c) { const g = c.getContext('2d'); g.clearRect(0, 0, 16, 16); FACE.forEach((r, y) => [...r].forEach((ch, x) => { if (FCOL[ch]) { g.fillStyle = FCOL[ch]; g.fillRect(x, y, 1, 1); } })); }

// ===== タイトル画面 =====
let heroRaf = null;
const HERO = Array.from({ length: 6 }, (_, i) => ({ name: 'hero' + i, waku: [3, 1, 4, 5, 6, 8][i], cc: [['#8a5a2b', '#5e3b1a', '#2b1a0e'], ['#b8692e', '#8a4c1f', '#e0a860'], ['#c4c4c4', '#9a9a9a', '#eeeeee'], ['#3a2c2a', '#221816', '#0e0a0a'], ['#5a3a22', '#3a2414', '#1a100a'], ['#8a5a2b', '#5e3b1a', '#2b1a0e']][i], silk: [['#e53935', '#ffffff'], ['#1e88e5', '#fdd835'], ['#ffffff', '#43a047'], ['#fb8c00', '#212121'], ['#8e24aa', '#f06292'], ['#00acc1', '#ffffff']][i] }));
function drawHero() {
  const c = $('hero'), W = 220, H = 70; c.width = W; c.height = H; const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  const t0 = performance.now(); cancelAnimationFrame(heroRaf);
  (function f(now) {
    if ($('titleScr').classList.contains('hidden')) return;
    const t = (now - t0) / 1000;
    g.fillStyle = '#7cc4ff'; g.fillRect(0, 0, W, 14); g.fillStyle = '#3f7f45'; g.fillRect(0, 10, W, 4);
    g.fillStyle = '#f4f4f4'; g.fillRect(0, 14, W, 1);
    // 芝の縞（流れるように動かす）
    const sh = (t * 90) % 60;
    for (let y = 15; y < H - 6; y += 16) { const h = Math.min(16, H - 6 - y), odd = (y >> 4) % 2;
      g.fillStyle = odd ? '#4ba84c' : '#55b455'; g.fillRect(0, y, W, h);
      g.fillStyle = odd ? '#55b455' : '#4ba84c'; for (let x = -sh; x < W; x += 60) g.fillRect(Math.round(x + 30), y, 30, h); }
    g.fillStyle = '#f4f4f4'; g.fillRect(0, H - 6, W, 2); for (let x = -((t * 90) % 16); x < W; x += 16) g.fillRect(x | 0, H - 4, 1, 3);
    g.fillStyle = '#3f8f4a'; g.fillRect(0, H - 3, W, 3);
    HERO.forEach((h, i) => {
      const x = ((t * (28 + (i % 3) * 1.3) + i * 38) % (W + 50)) - 26, y = 16 + (i % 3) * 14 + (i > 2 ? 4 : 0);
      g.drawImage(RaceView.horseSprite(h, Math.floor(t * 14 + i * 2) % 6), x | 0, y | 0);
    });
    heroRaf = requestAnimationFrame(f);
  })(t0);
}
function showTitle() {

  const d = peekMode('day'), r = peekMode('rich'), s = peekMode('simple'), today = jstDate();

  const dTxt = !dToday ? '今日はまだ遊んでいません' : d.day.finished ? `${d.day.attempt}回目終了（${yen(d.bal)}円）・もう一度挑戦できます` : `${d.day.attempt}回目 ${d.raceNo}R目 ／ 所持金 ${yen(d.bal)}円`;

  drawHero(); renderAccount(); window.scrollTo({ top: 0 });
}
